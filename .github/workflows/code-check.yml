name: Code check

# Runs the code blocks marked `check` in the default environment and compares their outputs.
# Separate from CI and the deploy, and only when code or the runner changes.
on:
  push:
    branches: [main]
    paths:
      - 'src/content/**/*.mdx'
      - 'src/lib/code/fence.ts'
      - 'src/lib/code/snippet.ts'
      - 'scripts/run-code.mjs'
      - 'code-envs/default/**'
      - '.github/workflows/code-check.yml'
  pull_request:
    paths:
      - 'src/content/**/*.mdx'
      - 'src/lib/code/fence.ts'
      - 'src/lib/code/snippet.ts'
      - 'scripts/run-code.mjs'
      - 'code-envs/default/**'
      - '.github/workflows/code-check.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: code-envs/default/requirements.txt
      - run: pip install -r code-envs/default/requirements.txt
      - run: node scripts/run-code.mjs --all --check --env default --local
